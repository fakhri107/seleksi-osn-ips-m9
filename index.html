        let state = {

            kunciLokal: false,

            pesanKunci: '',

        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!saved) return;
                state.jawaban = saved.jawaban || {};
                state.biodata = saved.biodata || { nama: '', kelas: '' };
                state.pelanggaran = saved.pelanggaran || [];
                state.sesi = saved.sesi || null;
                state.kunciLokal = !!saved.kunciLokal;
                state.bukaNoSaatKunci = saved.bukaNoSaatKunci || 0;
                state.jenisKunci = saved.jenisKunci || '';
                state.idx = typeof saved.idx === 'number' ? saved.idx : 0;
                state.sisa = typeof saved.sisa === 'number' ? saved.sisa : DURASI;
                state.submitted = !!saved.submitted;
                state.statusKirim = saved.statusKirim === 'mengirim' ? 'gagal' : (saved.statusKirim || null);
                if (state.submitted) {
                    state.screen = 'done';
                } else if (['quiz', 'biodata', 'terkunci'].includes(saved.screen)) {
                    state.screen = saved.screen;
                }
            } catch (e) {
                console.error("Gagal membaca memori lokal", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    jawaban: state.jawaban,
                    biodata: state.biodata,
                    pelanggaran: state.pelanggaran,
                    sesi: state.sesi,
                    kunciLokal: state.kunciLokal,
                    bukaNoSaatKunci: state.bukaNoSaatKunci,
                    jenisKunci: state.jenisKunci,
                    idx: state.idx,
                    sisa: state.sisa,
                    submitted: state.submitted,
                    statusKirim: state.statusKirim,
                    screen: state.screen
                }));
            } catch (e) {
                console.error("Gagal menyimpan memori lokal", e);
            }
        }

        function hitungSisa(s) {
            const akhir = s.status === 'terkunci' && s.terkunci_sejak ? new Date(s.terkunci_sejak).getTime() : Date.now();
            const berjalan = (akhir - new Date(s.mulai).getTime()) / 1000 - (s.jeda_detik || 0);
            return Math.max(0, Math.floor(DURASI - berjalan));
        }

        function startTimer() {
            clearInterval(state.timer);
            state.timer = setInterval(() => {
                if (state.screen !== 'quiz') return;
                state.sisa--;
                if (state.sisa <= 0) {
                    state.sisa = 0;
                    updateTimerUI();
                    submitQuiz(true);
                    return;
                }
                saveState();
                updateTimerUI();
            }, 1000);
        }

        function formatWaktu(detik) {
            const m = Math.floor(detik / 60).toString().padStart(2, '0');
            const d = (detik % 60).toString().padStart(2, '0');
            return `${m}:${d}`;
        }

        function updateTimerUI() {
            const el = document.getElementById('quiz-timer');
            if (!el) return;
            el.textContent = formatWaktu(state.sisa);
            el.parentElement.classList.toggle('bg-red-500', state.sisa <= 300);
            el.parentElement.classList.toggle('bg-white/10', state.sisa > 300);
        }

        function render() {
            const container = document.getElementById('app-container');
            if (!container) return;

            if (state.screen === 'welcome') {
                container.innerHTML = renderWelcome();
            } else if (state.screen === 'biodata') {
                container.innerHTML = renderBiodata();
            } else if (state.screen === 'quiz') {
                container.innerHTML = renderQuiz();
                updateTimerUI();
            } else if (state.screen === 'terkunci') {
                container.innerHTML = renderTerkunci();
            } else if (state.screen === 'selesai') {
                container.innerHTML = renderSelesai();
            } else {
                container.innerHTML = renderDone();
            }
            saveState();
        }

                                <i class="fa-regular fa-clock text-orange-300"></i>
                                <span id="quiz-timer">60:00</span>
                            </div>
                            <button onclick="toggleModal(true)" class="bg-white text-brand-blue hover:bg-blue-50 px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm">
                                Kumpulkan
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-b border-gray-200 py-3 px-4 sm:px-6 sticky top-0 z-20 shadow-sm">
                    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
                        <span class="text-sm font-bold text-gray-900 shrink-0">Soal ${state.idx + 1}/${SOAL.length}</span>

                        <div id="nav-pills" class="flex items-center space-x-1.5 overflow-x-auto custom-scrollbar px-2 py-1">
                            ${renderPills()}
                        </div>

                        <button onclick="toggleModal(true)" class="hidden sm:flex items-center space-x-1.5 px-3 py-1.5 border border-gray-300 hover:bg-gray-50 rounded-xl text-xs font-semibold text-gray-700 transition shrink-0">
                            <i class="fa-solid fa-border-all text-xs"></i>
                            <span>Semua Soal</span>
                        </button>
                    </div>
                </div>

                <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="px-6 pt-6 pb-4 border-b border-gray-100">
                            <span class="text-xs font-bold px-2.5 py-1 bg-orange-50 text-brand-orange rounded-lg uppercase tracking-wider">Teks ${t.id} - ${t.bidang}</span>
                            <h3 class="text-base font-bold text-gray-900 mt-3">${t.judul}</h3>
                        </div>
                        <div class="p-6 overflow-y-auto custom-scrollbar lg:max-h-[70vh]">
                            ${renderTeks(t)}
                        </div>
                    </section>

                    <section class="lg:col-span-7 bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-gray-200 flex flex-col">
                        <div class="flex items-center space-x-2 mb-4">
                            <span class="text-xs font-bold px-2.5 py-1 bg-blue-50 text-brand-blue rounded-lg uppercase tracking-wider">${BENTUK[s.bentuk]}</span>
                            <span class="text-xs font-bold text-gray-400">No. ${s.no}</span>
                        </div>
                        <div class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed mb-6">
                            ${s.soal}
                        </div>

                        <div class="flex-grow">
                            ${renderJawaban(s, state.jawaban[s.no])}
                        </div>

                        <div class="mt-8 pt-4 border-t border-gray-50 text-xs text-gray-400 flex items-center justify-between">
                            <span>Tes Seleksi Olimpiade IPS SMP - Soal ${s.no}</span>
                            <button onclick="showToast('Laporan soal telah terkirim!')" class="text-gray-400 hover:text-gray-600 flex items-center space-x-1">
                                <i class="fa-regular fa-flag"></i>
                                <span>Laporkan Soal</span>
                            </button>
                        </div>
                    </section>
                </div>

                <div class="bg-white border-t border-gray-200 p-4 sticky bottom-0 z-20">
                    <div class="max-w-6xl mx-auto flex items-center justify-between">
                        <button onclick="prevQuestion()" ${state.idx === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-5 py-2.5 rounded-xl border border-gray-300 text-xs font-semibold text-gray-400"' : 'class="px-5 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50 text-xs font-semibold text-gray-700 transition flex items-center space-x-2"'}>
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                            <span>Sebelumnya</span>
                        </button>

                        <button onclick="nextQuestion()" class="px-6 py-2.5 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold rounded-xl text-xs transition shadow-md flex items-center space-x-2">
                            <span>${state.idx === SOAL.length - 1 ? 'Ringkasan & Kumpulkan' : 'Berikutnya'}</span>
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTeks(t) {
            return t.blok.map(b => {
                if (b.tabel) return b.tabel;
                return b.teks.split(/ (?=\(\d+\) )/).map(p => {
                    const nomor = p.match(/^\(\d+\)/)[0];
                    const kalimat = p.replace(/^\(\d+\) /, '');
                    return `<p class="text-sm text-gray-800 leading-relaxed mb-3"><span class="font-bold text-brand-blue mr-1">${nomor}</span>${kalimat}</p>`;
                }).join('');
            }).join('');
        }

        function renderPills() {
            return SOAL.map((s, i) => {
                const isCurrent = i === state.idx;
                let style = "bg-gray-100 text-gray-700 border border-gray-200 hover:bg-gray-200";
                if (isCurrent) {
                    style = "bg-brand-orange text-white font-bold shadow-md scale-105";
                } else if (sudahDijawab(s)) {
                    style = "bg-brand-blue text-white font-semibold";
                }
                return `
                    <button onclick="goToQuestion(${i})" class="w-8 h-8 shrink-0 rounded-full text-xs transition flex items-center justify-center ${style}">
                        ${s.no}
                    </button>
                `;
            }).join('');
        }

        function renderJawaban(s, ans) {
            if (s.bentuk === 'pg') {
                return `
                    <div class="space-y-3">
                        ${s.opsi.map((teks, i) => {
                            const huruf = LETTERS[i];
                            const terpilih = ans === huruf;
                            return `
                                <button onclick="pilihPG(${s.no}, '${huruf}')" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start space-x-3 ${terpilih ? 'border-brand-blue bg-blue-50/50 shadow-sm' : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'}">
                                    <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs shrink-0 mt-0.5 ${terpilih ? 'bg-brand-blue text-white' : 'bg-gray-100 text-gray-600'}">
                                        ${huruf}
                                    </div>
                                    <div class="text-sm text-gray-800 leading-snug pt-0.5">${teks}</div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            if (s.bentuk === 'pilih') {
                const terpilih = Array.isArray(ans) ? ans : [];
                return `
                    <p class="text-xs font-semibold text-brand-orange mb-3">Pilih semua jawaban yang benar. Jawaban yang salah akan mengurangi skor.</p>
                    <div class="space-y-3">
                        ${s.opsi.map((teks, i) => {
                            const huruf = LETTERS[i];
                            const dipilih = terpilih.includes(huruf);
                            return `
                                <button onclick="togglePilih(${s.no}, '${huruf}')" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start space-x-3 ${dipilih ? 'border-brand-blue bg-blue-50/50 shadow-sm' : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'}">
                                    <i class="${dipilih ? 'fa-solid fa-square-check text-brand-blue' : 'fa-regular fa-square text-gray-400'} text-lg mt-0.5 shrink-0"></i>
                                    <div class="text-sm text-gray-800 leading-snug">
                                        <span class="font-bold mr-1">${huruf}.</span>${teks}
                                    </div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            if (s.bentuk === 'klasifikasi' || s.bentuk === 'bstd' || s.bentuk === 'sebab') {
                const obj = ans || {};
                return `
                    <div class="overflow-x-auto border border-gray-200 rounded-xl">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-gray-50 text-xs uppercase tracking-wider text-gray-500">
                                    <th class="p-3 text-left w-12">No</th>
                                    <th class="p-3 text-left">${s.bentuk === 'sebab' ? 'Sebab dan Akibat' : 'Pernyataan'}</th>
                                    <th class="p-3 text-center">Jawaban</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${s.butir.map(b => `
                                    <tr class="border-t border-gray-100 align-top">
                                        <td class="p-3 font-bold text-gray-600">${b.k}</td>
                                        <td class="p-3 text-gray-800 leading-snug">
                                            ${b.sebab ? `<span class="font-semibold">Sebab:</span> ${b.sebab}<br><span class="font-semibold">Akibat:</span> ${b.akibat}` : b.t}
                                        </td>
                                        <td class="p-3">
                                            <div class="flex justify-center">
                                                <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden">
                                                    ${s.kode.map(v => `
                                                        <button onclick="pilihButir(${s.no}, '${b.k}', '${v}')" class="px-3 py-1.5 text-xs font-bold transition ${obj[b.k] === v ? 'bg-brand-blue text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}">${v}</button>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (s.bentuk === 'jodoh') {
                const obj = ans || {};
                return `
                    <div class="space-y-4">
                        <div>
                            <span class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Daftar Pernyataan</span>
                            <div class="space-y-2">
                                ${s.pengertian.map(p => `
                                    <div class="flex items-start space-x-3 p-3 rounded-xl bg-gray-50 border border-gray-100 text-sm">
                                        <span class="font-bold text-brand-blue shrink-0">${p.k}.</span>
                                        <span class="text-gray-800 leading-snug">${p.t}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="overflow-x-auto border border-gray-200 rounded-xl">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="bg-gray-50 text-xs uppercase tracking-wider text-gray-500">
                                        <th class="p-3 text-left">Pihak</th>
                                        <th class="p-3 text-left w-40">Pilih Pernyataan</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${s.istilah.map(it => `
                                        <tr class="border-t border-gray-100">
                                            <td class="p-3 text-gray-800 font-semibold">${it.k}. ${it.t}</td>
                                            <td class="p-3">
                                                <select onchange="pilihButir(${s.no}, '${it.k}', this.value)" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none">
                                                    <option value="">-- Pilih --</option>
                                                    ${s.pengertian.map(p => `<option value="${p.k}" ${obj[it.k] === p.k ? 'selected' : ''}>${p.k}</option>`).join('')}
                                                </select>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (s.bentuk === 'urut') {
                const obj = ans || {};
                return `
                    <div class="space-y-4">
                        <div>
                            <span class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Daftar Peristiwa</span>
                            <div class="space-y-2">
                                ${s.pilihan.map(p => `
                                    <div class="flex items-start space-x-3 p-3 rounded-xl bg-gray-50 border border-gray-100 text-sm">
                                        <span class="font-bold text-brand-blue shrink-0">${p.k}.</span>
                                        <span class="text-gray-800 leading-snug">${p.t}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div>
                            <span class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Urutan (dari yang paling awal)</span>
                            <div class="grid grid-cols-5 gap-2">
                                ${[1, 2, 3, 4, 5].map(pos => `
                                    <div class="text-center">
                                        <span class="block text-xs text-gray-500 mb-1">${pos}</span>
                                        <select onchange="pilihButir(${s.no}, ${pos}, this.value)" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-brand-blue">
                                            <option value="">-</option>
                                            ${s.pilihan.map(p => `<option value="${p.k}" ${obj[pos] === p.k ? 'selected' : ''}>${p.k}</option>`).join('')}
                                        </select>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (s.bentuk === 'isian') {
                const obj = ans || {};
                return `
                    <div class="space-y-4">
                        ${s.items.map(it => `
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-700">${it.k}. ${it.label}:</label>
                                <div class="flex items-stretch border-2 border-gray-200 focus-within:border-brand-blue rounded-xl overflow-hidden transition">
                                    <input type="text" inputmode="decimal" value="${esc(obj[it.k])}" oninput="setIsian(${s.no}, '${it.k}', this.value)" placeholder="Ketik jawaban" class="flex-1 min-w-0 p-4 text-base outline-none">
                                    <span class="px-4 flex items-center bg-gray-50 text-sm font-bold text-gray-600 border-l border-gray-200">${it.satuan}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Tuliskan Jawaban Uraian Anda:</label>
                    ${s.hint ? `<p class="text-xs font-semibold text-brand-orange">${s.hint}</p>` : ''}
                    <textarea rows="10" oninput="setJawaban(${s.no}, this.value)" placeholder="Ketikkan penjelasan lengkap di sini..." class="w-full p-4 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none custom-scrollbar">${esc(state.jawaban[s.no])}</textarea>
                </div>
            `;
        }

        function renderStatusKirim() {
            if (state.statusKirim === 'berhasil') {
                return `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Hasil sudah tersimpan di server.</span>
                    </div>
                `;
            }
            if (state.statusKirim === 'mengirim') {
                return `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>Mengirim hasil...</span>
                    </div>
                `;
            }
            return `
                <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-xs text-red-800 space-y-3">
                    <span class="block">Hasil belum terkirim. Periksa koneksi internet, lalu coba lagi. Jawabanmu tetap tersimpan.</span>
                    <button onclick="kirimHasil()" class="px-4 py-2 bg-brand-blue hover:bg-blue-900 text-white font-bold rounded-lg transition">
                        Kirim Ulang
                    </button>
                </div>
            `;
        }

        function renderDone() {
            const dijawab = SOAL.filter(sudahDijawab).length;
            const waktuPakai = DURASI - state.sisa;
            return `
                <div class="bg-brand-blue text-white py-10 px-4 sm:px-6">
                    <div class="max-w-4xl mx-auto text-center">
                        <h1 class="text-xl sm:text-2xl font-bold mb-1">Tes Selesai</h1>
                        <p class="text-xs text-blue-200">Tes Seleksi Olimpiade IPS SMP Muhammadiyah 9 Jakarta</p>
                    </div>
                </div>

                <div class="max-w-xl mx-auto px-4 -mt-10 mb-12 relative z-20 w-full">
                    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-xl border border-gray-100 text-center space-y-6">
                        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>

                        <div>
                            <h2 class="text-lg font-bold text-gray-900 mb-2">Jawaban Berhasil Dikumpulkan</h2>
                            <p class="text-xs text-gray-500 leading-relaxed">
                                Terima kasih telah mengerjakan tes. Jawabanmu sudah tersimpan dan akan dinilai oleh guru.
                            </p>
                        </div>

                        ${renderStatusKirim()}

                        <div class="bg-blue-50/60 rounded-xl p-4 border border-blue-100 text-left space-y-1">
                            <span class="block text-sm font-bold text-gray-900">${esc(state.biodata.nama) || '-'}</span>
                            <span class="block text-xs text-gray-500">Kelas ${esc(state.biodata.kelas) || '-'}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3 border-t border-b border-gray-100 py-4">
                            <div>
                                <span class="block text-xl font-bold text-brand-blue">${dijawab} / ${SOAL.length}</span>
                                <span class="text-xs text-gray-500 font-medium">Soal Terjawab</span>
                            </div>
                            <div>
                                <span class="block text-xl font-bold text-gray-700">${formatWaktu(waktuPakai)}</span>
                                <span class="text-xs text-gray-500 font-medium">Waktu Pengerjaan</span>
                            </div>
                        </div>

                        <button onclick="resetTes()" class="text-xs font-semibold text-gray-500 hover:text-gray-700 flex items-center justify-center space-x-2 mx-auto transition">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Atur Ulang Tes</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function sudahDijawab(s) {
            const a = state.jawaban[s.no];
            switch (s.bentuk) {
                case 'pilih':
                    return Array.isArray(a) && a.length > 0;
                case 'klasifikasi':
                case 'bstd':
                case 'sebab':
                    return !!a && s.butir.every(b => !!a[b.k]);
                case 'jodoh':
                    return !!a && s.istilah.every(it => !!a[it.k]);
                case 'urut':
                    return !!a && [1, 2, 3, 4, 5].every(pos => !!a[pos]);
                case 'isian':
                    return !!a && s.items.every(it => a[it.k] !== undefined && String(a[it.k]).trim() !== '');
                default:
                    return typeof a === 'string' && a.trim() !== '';
            }
        }

        function bukaBiodata() {
            state.screen = 'biodata';
            render();
        }

        function kembaliDariBiodata() {
            const nama = document.getElementById('bio-nama').value;
            const kelas = document.getElementById('bio-kelas').value;
            state.biodata = { nama: nama.trim(), kelas };
            state.screen = 'welcome';
            render();
        }

        async function sinkronSesi() {
            const { data, error } = await db.rpc('mulai_sesi', {
                p_nama: state.biodata.nama,
                p_kelas: state.biodata.kelas
            });
            if (error) throw error;
            if (state.kunciLokal && data.buka_no > state.bukaNoSaatKunci) {
                state.kunciLokal = false;
            }
            state.sesi = data;
            saveState();
            return data;
        }

        async function aturStatusAwal() {
            const s = state.sesi;
            if (s.status === 'selesai') {
                state.screen = 'selesai';
            } else if (s.status === 'terkunci') {
                state.screen = 'terkunci';
            } else if (state.kunciLokal) {
                state.screen = 'terkunci';
                await catatKeServer(state.jenisKunci || 'Pelanggaran');
            } else {
                state.sisa = hitungSisa(s);
                if (state.sisa <= 0) {
                    state.screen = 'quiz';
                    render();
                    submitQuiz(true);
                    return;
                }
                state.screen = 'quiz';
                startTimer();
            }
            render();
        }

        async function simpanBiodata() {
            const nama = document.getElementById('bio-nama').value.trim();
            const kelas = document.getElementById('bio-kelas').value;

            if (!nama) {
                showToast('Nama lengkap wajib diisi.');
                document.getElementById('bio-nama').focus();
                return;
            }
            if (!kelas) {
                showToast('Silakan pilih kelas terlebih dahulu.');
                return;
            }

            state.biodata = { nama, kelas };
            try {
                await sinkronSesi();
            } catch (e) {
                console.error(e);
                showToast('Tidak bisa terhubung ke server. Periksa koneksi internet lalu coba lagi.');
                return;
            }
            await aturStatusAwal();
        }

        function pilihPG(no, huruf) {
            if (state.submitted) return;
            state.jawaban[no] = huruf;
            render();
        }

        function togglePilih(no, huruf) {
            if (state.submitted) return;
            const daftar = Array.isArray(state.jawaban[no]) ? state.jawaban[no] : [];
            state.jawaban[no] = daftar.includes(huruf)
                ? daftar.filter(h => h !== huruf)
                : [...daftar, huruf];
            render();
        }

        function pilihButir(no, k, nilai) {
            if (state.submitted) return;
            state.jawaban[no] = { ...(state.jawaban[no] || {}), [k]: nilai };
            render();
        }

        function setIsian(no, k, nilai) {
            if (state.submitted) return;
            state.jawaban[no] = { ...(state.jawaban[no] || {}), [k]: nilai };
            saveState();
            document.getElementById('nav-pills').innerHTML = renderPills();
        }

        function setJawaban(no, nilai) {
            if (state.submitted) return;
            state.jawaban[no] = nilai;
            saveState();
            document.getElementById('nav-pills').innerHTML = renderPills();
        }

        function goToQuestion(idx) {
            state.idx = idx;
            render();
        }

        function prevQuestion() {
            if (state.idx > 0) {
                state.idx--;
                render();
            }
        }

        function nextQuestion() {
            if (state.idx < SOAL.length - 1) {
                state.idx++;
                render();
            } else {
                toggleModal(true);
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('overview-modal');
            if (!modal) return;
            if (show) {
                updateModal();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function updateModal() {
            const dijawab = SOAL.filter(sudahDijawab).length;
            const kosong = SOAL.length - dijawab;
            const persen = Math.round((dijawab / SOAL.length) * 100);

            document.getElementById('modal-answered-count').innerText = dijawab;
            document.getElementById('modal-skipped-count').innerText = kosong;
            document.getElementById('modal-progress-bar').style.width = `${persen}%`;

            const warning = document.getElementById('modal-warning-banner');
            const submitBtn = document.getElementById('modal-submit-btn');

            if (kosong > 0) {
                warning.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.className = "px-6 py-2.5 bg-gray-200 text-gray-400 text-xs font-bold rounded-xl cursor-not-allowed transition border border-gray-300 flex items-center space-x-1.5";
                submitBtn.innerHTML = `<i class="fa-solid fa-lock text-xs"></i><span>Belum Lengkap (${kosong} Soal Kosong)</span>`;
            } else {
                warning.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.className = "px-6 py-2.5 bg-brand-orange hover:bg-brand-orangeHover text-white text-xs font-bold rounded-xl shadow-md transition cursor-pointer";
                submitBtn.innerHTML = `Ya, Kumpulkan Sekarang`;
            }

            document.getElementById('modal-grid').innerHTML = SOAL.map((s, i) => {
                const isAns = sudahDijawab(s);
                const isCurr = state.idx === i;
                let style = "bg-gray-50 text-gray-700 border-gray-200 hover:bg-gray-100";
                if (isCurr) {
                    style = "bg-brand-orange text-white border-brand-orange font-bold shadow-md";
                } else if (isAns) {
                    style = "bg-brand-blue text-white border-brand-blue font-bold";
                }
                return `
                    <button onclick="toggleModal(false); goToQuestion(${i});" class="py-2 rounded-xl text-xs font-bold transition border ${style}">
                        ${s.no}
                    </button>
                `;
            }).join('');
        }

        async function kirimHasil() {
            state.statusKirim = 'mengirim';
            render();

            try {
                const { error } = await db.rpc('kirim_hasil', {
                    p_nama: state.biodata.nama,
                    p_kelas: state.biodata.kelas,
                    p_durasi: DURASI - state.sisa,
                    p_jawaban: state.jawaban,
                    p_sesi: state.sesi ? state.sesi.id : null
                });
                if (error) throw error;
                state.statusKirim = 'berhasil';
            } catch (e) {
                console.error("Gagal mengirim hasil", e);
                state.statusKirim = 'gagal';
            }
            render();
        }

        function submitQuiz(paksa) {
            const kosong = SOAL.filter(s => !sudahDijawab(s)).length;
            if (!paksa && kosong > 0) {
                showToast(`Tidak bisa mengumpulkan! Masih ada ${kosong} soal yang belum dijawab.`);
                return;
            }

            toggleModal(false);
            state.submitted = true;
            state.screen = 'done';
            clearInterval(state.timer);
            saveState();
            kirimHasil();
        }

        function resetTes() {
            if (!confirm('Hapus semua jawaban dan atur ulang tes?')) return;
            localStorage.removeItem(STORAGE_KEY);
            clearInterval(state.timer);
            state = {
                screen: 'welcome',
                idx: 0,
                jawaban: {},
                biodata: { nama: '', kelas: '' },
                pelanggaran: [],
                sesi: null,
                kunciLokal: false,
                bukaNoSaatKunci: 0,
                jenisKunci: '',
                pesanKunci: '',
                submitted: false,
                statusKirim: null,
                sisa: DURASI,
                timer: null
            };
            render();
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 flex items-center space-x-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-orange-300"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function showPeringatan(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white text-xs sm:text-sm px-5 py-3 rounded-xl shadow-xl z-[60] flex items-center space-x-2 max-w-md';
            toast.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function catatKeServer(jenis) {
            if (!state.sesi) return false;
            const { data, error } = await db.rpc('catat_pelanggaran', {
                p_sesi: state.sesi.id,
                p_jenis: jenis,
                p_soal: SOAL[state.idx].no
            });
            if (error) {
                console.error(error);
                return false;
            }
            state.sesi.status = data.status;
            saveState();
            return true;
        }

        let terakhirCatat = 0;

        async function catatPelanggaran(jenis) {
            if (state.screen !== 'quiz' || state.submitted) return;
            const sekarang = Date.now();
            if (sekarang - terakhirCatat < 1500) return;
            terakhirCatat = sekarang;

            state.pelanggaran.push({
                waktu: new Date().toISOString(),
                jenis: jenis,
                soal: SOAL[state.idx].no
            });
            state.kunciLokal = true;
            state.jenisKunci = jenis;
            state.bukaNoSaatKunci = state.sesi ? (state.sesi.buka_no || 0) : 0;
            state.screen = 'terkunci';
            state.pesanKunci = '';
            clearInterval(state.timer);
            saveState();
            render();
            showPeringatan(`${jenis}. Tes dikunci.`);

            const ok = await catatKeServer(jenis);
            if (!ok) {
                state.pesanKunci = 'Koneksi ke server bermasalah. Kunci tetap berlaku dan pelanggaran akan dicatat ulang saat halaman dibuka kembali.';
                render();
            }
        }

        async function bukaDenganKode(kode) {
            state.pesanKunci = 'Memeriksa kode...';
            render();
            try {
                const { data, error } = await db.rpc('buka_kunci', {
                    p_sesi: state.sesi.id,
                    p_kode: kode
                });
                if (error) throw error;
                if (data !== 'ok') {
                    const pesan = {
                        salah: 'Kode salah. Periksa kembali kode dari pengawas.',
                        habis: 'Kode tidak berlaku lagi. Minta kode baru kepada pengawas.',
                        tidak_terkunci: 'Tes ini tidak sedang dikunci. Muat ulang halaman.'
                    };
                    state.pesanKunci = pesan[data] || 'Kode tidak berlaku.';
                    render();
                    return;
                }
                state.kunciLokal = false;
                await sinkronSesi();
                state.pesanKunci = '';
                await aturStatusAwal();
            } catch (e) {
                console.error(e);
                state.pesanKunci = 'Gagal terhubung ke server. Coba lagi.';
                render();
            }
        }

        function pasangPengawasan() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) catatPelanggaran('Pindah ke tab atau aplikasi lain');
            });
            window.addEventListener('blur', () => catatPelanggaran('Keluar dari halaman tes'));
            document.addEventListener('copy', e => { e.preventDefault(); catatPelanggaran('Menyalin teks'); });
            document.addEventListener('cut', e => { e.preventDefault(); catatPelanggaran('Memotong teks'); });
            document.addEventListener('paste', e => { e.preventDefault(); catatPelanggaran('Menempel teks'); });
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'PrintScreen') catatPelanggaran('Menekan tombol PrintScreen');
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') e.preventDefault();
            });
        }

        window.onload = async function () {
            loadState();
            pasangPengawasan();
            render();

            const perluSinkron = state.sesi && state.biodata.nama && ['quiz', 'terkunci'].includes(state.screen);
            if (perluSinkron) {
                try {
                    await sinkronSesi();
                    await aturStatusAwal();
                } catch (e) {
                    console.error(e);
                    if (state.screen === 'quiz') startTimer();
                }
            }
        };
    </script>
</body>
</html>
